<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>謎解き推理シート</title>
  <style>
    :root{--ink:#f4f0ff;--muted:#aaa3bf;--line:rgba(255,255,255,.12);--panel:rgba(20,16,42,.72);--accent:#8b5cf6;--accent2:#22d3ee;--bg:#090714}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI",sans-serif;background:radial-gradient(circle at 14% 10%,#312064 0,transparent 32%),radial-gradient(circle at 90% 80%,#153754 0,transparent 35%),var(--bg)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
    .app{width:min(1120px,calc(100% - 28px));margin:34px auto 48px;position:relative}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{color:#a78bfa;letter-spacing:.18em;font-size:.72rem;font-weight:800}.title{font-size:clamp(1.7rem,4vw,3.1rem);margin:5px 0 4px;letter-spacing:.03em}.subtitle{color:var(--muted);margin:0;font-size:.9rem}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:700}.btn:hover{background:rgba(255,255,255,.12)}.btn.primary{background:linear-gradient(135deg,var(--accent),#6366f1);border:0}
    .board{overflow:hidden;border:1px solid rgba(255,255,255,.15);background:var(--panel);backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
    .grid{display:grid;grid-template-columns:minmax(136px,1.4fr) repeat(7,minmax(62px,1fr));align-items:stretch}.cell{min-height:39px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.grid>.cell:nth-child(8n){border-right:0}.name-head{padding:9px 12px;justify-content:flex-start;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em}.player{position:relative;padding:6px}.player input{width:100%;border:0;outline:0;text-align:center;color:white;background:transparent;font:700 .82rem inherit;padding:6px 2px;border-bottom:2px solid var(--pc)}.player:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 14%,transparent),transparent);pointer-events:none}.section{grid-column:1/-1;min-height:42px;padding:0 14px;justify-content:flex-start;gap:9px;background:rgba(255,255,255,.035);font-size:.78rem;font-weight:900;letter-spacing:.12em}.section b{width:7px;height:7px;border-radius:50%;background:var(--sc);box-shadow:0 0 14px var(--sc)}.label{justify-content:flex-start;padding:0 14px;font-weight:650;font-size:.85rem;background:rgba(255,255,255,.025)}
    .mark{cursor:pointer;position:relative;transition:.15s;background:transparent}.mark:hover{background:rgba(255,255,255,.055)}.mark:after{content:"";width:21px;height:21px;border:1.5px solid rgba(255,255,255,.18);border-radius:7px;transition:.18s}.mark[data-state="1"]:after{content:"✓";display:grid;place-items:center;color:#081017;font-weight:1000;border-color:var(--pc);background:var(--pc);box-shadow:0 0 18px color-mix(in srgb,var(--pc) 45%,transparent)}.mark[data-state="2"]:after{content:"×";display:grid;place-items:center;color:#fda4af;font-size:1.2rem;border-color:#fb7185;background:rgba(244,63,94,.12)}
    .legend{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:.76rem;padding:15px 18px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.25);display:inline-grid;place-items:center}.status{margin-left:auto}.status.saved{color:#67e8f9}
    @media(max-width:760px){
      .app{width:calc(100% - 12px);margin:12px auto 24px}.top{align-items:flex-start;flex-direction:column;gap:12px;margin-bottom:12px}.title{font-size:1.65rem}.subtitle{font-size:.76rem;line-height:1.55}.actions{width:100%}.btn{flex:1;padding:9px}
      .board{border-radius:15px;overflow:hidden}.grid{min-width:0;grid-template-columns:94px repeat(7,minmax(0,1fr))}.cell{min-height:38px}.name-head{padding:5px 7px;font-size:.58rem;line-height:1.25}.player{padding:4px 2px}.player input{font-size:.58rem;padding:5px 0;letter-spacing:-.04em}.section{min-height:36px;padding:0 9px;font-size:.7rem}.label{padding:0 7px;font-size:.69rem;letter-spacing:-.04em;white-space:nowrap}.mark:after{width:19px;height:19px;border-radius:6px}.legend{padding:11px 10px;gap:9px;font-size:.65rem}.status{display:none}
    }
    @media(max-width:390px){.app{width:100%;margin-top:0}.top{padding:13px 12px 0}.board{border-radius:0;border-left:0;border-right:0}.grid{grid-template-columns:88px repeat(7,minmax(0,1fr))}.label{padding:0 5px;font-size:.65rem}.mark:after{width:18px;height:18px}.player input{font-size:.54rem}.legend{padding-inline:9px}}
    @media print{@page{size:A4 portrait;margin:8mm}body{background:white;color:#171126}body:before,.actions,.subtitle{display:none}.app{width:100%;margin:0}.top{margin:0 0 5mm}.eyebrow{color:#6d28d9}.title{font-size:20pt}.board{box-shadow:none;border:1px solid #bbb;background:white;border-radius:8px}.cell{min-height:7.35mm;border-color:#cbc6d8}.section{min-height:7mm;background:#eee9fa}.label{background:#faf9fc}.player input{color:#171126}.mark:after{border-color:#aaa}.legend{padding:3mm}.grid{grid-template-columns:31mm repeat(7,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">DEDUCTION NOTE / 01</div><h1 class="title">謎解き推理シート</h1><p class="subtitle">マスをタップして、手がかりをチェックしよう。</p></div><div class="actions"><button class="btn" id="reset">リセット</button><button class="btn primary" onclick="print()">印刷する</button></div></header>
  <section class="board"><div class="grid" id="grid"></div><footer class="legend"><span><i class="dot">✓</i>チェック済み</span><span class="status" id="status">自動保存</span></footer></section>
</main>
<script>
const players=['PLAYER 1','PLAYER 2','PLAYER 3','PLAYER 4','PLAYER 5','PLAYER 6','PLAYER 7'];
const sections=[
 {title:'誰が？',color:'#a78bfa',items:['グリーン','マスタード','ピーコック','プラム','スカーレット','ホワイト']},
 {title:'何を使って？',color:'#22d3ee',items:['レンチ','ろうそく台','短剣','ピストル','鉄パイプ','ロープ']},
 {title:'どこで？',color:'#f59e0b',items:['バスルーム','書斎','ダイニングルーム','ゲームルーム','ガレージ','ベッドルーム','リビングルーム','キッチン','中庭']}
];
const colors=['#a78bfa','#22d3ee','#34d399','#fbbf24','#fb7185','#60a5fa','#e879f9'];
const key='modern-deduction-sheet-v1', saved=JSON.parse(localStorage.getItem(key)||'{}');
const grid=document.querySelector('#grid'); let html='<div class="cell name-head">項目 / プレイヤー</div>';
players.forEach((p,i)=>html+=`<div class="cell player" style="--pc:${colors[i]}"><input aria-label="プレイヤー${i+1}の名前" data-name="${i}" value="${saved.names?.[i]||p}"></div>`);
let row=0; sections.forEach(s=>{html+=`<div class="cell section" style="--sc:${s.color}"><b></b>${s.title}</div>`;s.items.forEach(item=>{html+=`<div class="cell label">${item}</div>`;players.forEach((_,i)=>{const state=saved.marks?.[row]?.[i]===1?1:0;html+=`<div class="cell mark" role="checkbox" aria-checked="${state===1}" tabindex="0" aria-label="${item}・プレイヤー${i+1}" data-row="${row}" data-col="${i}" data-state="${state}" style="--pc:${colors[i]}"></div>`});row++})});grid.innerHTML=html;
function save(){const names=[...document.querySelectorAll('[data-name]')].map(x=>x.value);const marks=Array.from({length:row},()=>Array(7).fill(0));document.querySelectorAll('.mark').forEach(x=>marks[x.dataset.row][x.dataset.col]=+x.dataset.state);localStorage.setItem(key,JSON.stringify({names,marks}));const st=document.querySelector('#status');st.textContent='保存しました';st.classList.add('saved');setTimeout(()=>{st.textContent='自動保存';st.classList.remove('saved')},900)}
function cycle(el){el.dataset.state=el.dataset.state==='1'?0:1;el.setAttribute('aria-checked',el.dataset.state==='1');save()}
grid.addEventListener('click',e=>{const m=e.target.closest('.mark');if(m)cycle(m)});grid.addEventListener('keydown',e=>{const m=e.target.closest('.mark');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cycle(m)}});grid.addEventListener('input',save);
document.querySelector('#reset').addEventListener('click',()=>{if(confirm('すべての記録を消去しますか？')){localStorage.removeItem(key);location.reload()}});
</script>
</body>
</html>
