<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Games & Tech</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #111827;
            --card-bg: #1f2937;
            --text: #f3f4f6;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        h2 { margin-top: 40px; color: var(--primary); font-size: 1.2rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            background: #2d3748;
        }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card p { margin: 0; font-size: 0.85rem; color: #9ca3af; }
        
        .badge {
            display: inline-block;
            background: var(--primary);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GAME ラボ</h1>
        <p>制作したゲームをまとめています。</p>
    </header>

    <h2>🎮 Game Works</h2>
    <div class="grid">
        <a href="./GAME/CheersBABA-NUKI.html" class="card">
            <span class="badge">Browser Game</span>
            <h3>CHEERSババ抜き</h3>
            <p>ババ抜きのデジタル版。直感的に遊べるカードゲームです。</p>
        </a>
        <a href="./GAME/CheersOnline.html" class="card">
            <span class="badge">Online</span>
            <h3>CheersOnline</h3>
            <p>オンラインで対戦可能なCheersシリーズのメインコンテンツ。</p>
        </a>
        <a href="./GAME/ModernP2PCardGame.html" class="card">
            <span class="badge">P2P</span>
            <h3>大富豪 (Modern P2P)</h3>
            <p>P2P通信を利用した、モダンな仕様の大富豪ゲーム。</p>
        </a>
    </div>

</div>

</body>
</html>
