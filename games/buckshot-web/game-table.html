<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Four Hands — Game Table</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
            --gold: #e7bd68;
            --ink: #0d100f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            color: #fff8e8;
            background: var(--ink);
        }

        button { font: inherit; }

        .game {
            position: relative;
            min-height: 100svh;
            isolation: isolate;
            background: #101613 url("images/game-table-concept.png") center / cover no-repeat;
        }

        .game::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(6, 8, 7, .42), transparent 26%, transparent 72%, rgba(4, 7, 6, .8)),
                radial-gradient(circle at center, transparent 38%, rgba(0, 0, 0, .42) 100%);
        }

        .topbar {
            position: absolute;
            inset: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(16px, 2.4vw, 34px);
            pointer-events: none;
        }

        .brand {
            letter-spacing: .28em;
            text-transform: uppercase;
            font-weight: 800;
            font-size: clamp(.72rem, 1.1vw, 1rem);
            text-shadow: 0 2px 14px #000;
        }

        .round {
            padding: .65rem 1rem;
            border: 1px solid rgba(231, 189, 104, .55);
            border-radius: 999px;
            color: var(--gold);
            background: rgba(8, 10, 9, .58);
            backdrop-filter: blur(10px);
            font-size: .75rem;
            letter-spacing: .16em;
        }

        .player {
            position: absolute;
            display: grid;
            justify-items: center;
            gap: 6px;
            filter: drop-shadow(0 4px 8px #000);
        }

        .player strong {
            padding: .35rem .65rem;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 999px;
            background: rgba(8, 10, 9, .62);
            backdrop-filter: blur(8px);
            font-size: clamp(.65rem, 1vw, .85rem);
            letter-spacing: .08em;
        }

        .player span { color: #dfc992; font-size: .68rem; }
        .p2 { top: 16%; left: 50%; transform: translateX(-50%); }
        .p3 { top: 30%; left: 4%; }
        .p4 { top: 30%; right: 4%; }

        .turn {
            position: absolute;
            left: 50%;
            top: 43%;
            width: min(88vw, 410px);
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 0 3px 18px #000;
            pointer-events: none;
        }

        .turn small {
            color: var(--gold);
            letter-spacing: .28em;
            text-transform: uppercase;
        }

        .turn h1 {
            margin: .45rem 0 0;
            font-family: Georgia, "Yu Mincho", serif;
            font-size: clamp(1.35rem, 3.2vw, 2.7rem);
            font-weight: 500;
        }

        .hotspot {
            position: absolute;
            border: 1px solid transparent;
            border-radius: 18px;
            color: transparent;
            background: transparent;
            cursor: pointer;
            transition: border-color .2s, box-shadow .2s, transform .2s;
        }

        .hotspot:hover,
        .hotspot:focus-visible,
        .hotspot.active {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(231, 189, 104, .16), 0 0 35px rgba(231, 189, 104, .35);
        }

        .cards {
            left: 31%;
            bottom: 5%;
            width: 36%;
            height: 28%;
        }

        .cards:hover,
        .cards:focus-visible,
        .cards.active { transform: translateY(-7px); }

        .gun {
            right: 4%;
            bottom: 2%;
            width: 29%;
            height: 34%;
        }

        .gun:hover,
        .gun:focus-visible,
        .gun.active { transform: rotate(-1deg) translateY(-4px); }

        .controls {
            position: absolute;
            left: 50%;
            bottom: clamp(12px, 2vw, 24px);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .action {
            min-width: 130px;
            padding: .78rem 1.1rem;
            border: 1px solid rgba(231, 189, 104, .58);
            border-radius: 999px;
            color: #211706;
            background: linear-gradient(180deg, #f5d890, #c7963e);
            box-shadow: 0 8px 30px rgba(0,0,0,.42);
            cursor: pointer;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .status {
            min-width: 190px;
            padding: .7rem 1rem;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 999px;
            color: #eadfca;
            background: rgba(6, 9, 8, .68);
            backdrop-filter: blur(12px);
            text-align: center;
            font-size: .78rem;
        }

        @media (max-width: 720px) {
            .game { background-position: 50% center; }
            .player { display: none; }
            .turn { top: 34%; }
            .cards { left: 22%; width: 50%; height: 27%; }
            .gun { right: 0; width: 36%; height: 30%; }
            .controls { width: calc(100% - 24px); }
            .action, .status { min-width: 0; flex: 1; }
        }
    </style>
</head>
<body>
<main class="game" aria-label="4人用カードゲームテーブル">
    <header class="topbar">
        <div class="brand">Four Hands</div>
        <div class="round">ROUND 01</div>
    </header>

    <div class="player p2"><strong>P2 · RAVEN</strong><span>3 CARDS</span></div>
    <div class="player p3"><strong>P3 · COLT</strong><span>3 CARDS</span></div>
    <div class="player p4"><strong>P4 · ROSE</strong><span>3 CARDS</span></div>

    <section class="turn" aria-live="polite">
        <small>Your turn</small>
        <h1>カードを選んでください</h1>
    </section>

    <button class="hotspot cards" type="button" aria-label="手札3枚を選択"></button>
    <button class="hotspot gun" type="button" aria-label="銃を選択"></button>

    <div class="controls">
        <div class="status" id="status">手札または銃を選択</div>
        <button class="action" type="button" id="confirm" disabled>決定</button>
    </div>
</main>

<script>
    const status = document.querySelector('#status');
    const confirm = document.querySelector('#confirm');
    const hotspots = document.querySelectorAll('.hotspot');
    let selected = '';

    hotspots.forEach((button) => {
        button.addEventListener('click', () => {
            hotspots.forEach((item) => item.classList.remove('active'));
            button.classList.add('active');
            selected = button.classList.contains('cards') ? 'カード' : '銃';
            status.textContent = `${selected}を選択中`;
            confirm.disabled = false;
        });
    });

    confirm.addEventListener('click', () => {
        status.textContent = `${selected}を決定しました`;
        confirm.disabled = true;
    });
</script>
</body>
</html>
