<body>
  <div class="flash" id="flash"></div>
  <main class="shell">

          <div id="joinFields" class="field" style="margin-top:12px"><label>ROOM CODE</label><div class="room-row"><input id="roomInput" maxlength="6" placeholder="例：K7M2QX" autocomplete="off" style="text-transform:uppercase"><button id="connectBtn">参加</button></div></div>
          <button class="start-btn" id="createBtn">ルームを作る</button><div id="roomCode" class="room-code" hidden></div>
          <div id="netStatus" class="net-status"></div><div id="lobbyList" class="lobby-list"></div>
          <button class="start-btn" id="hostStartBtn" hidden disabled>2人以上でゲーム開始</button>
        </div>
      </div>
    </section>
    <section id="game" class="screen">
      <div class="game-grid">
        <section class="panel arena" id="arena">
          <div class="roundbar"><div class="round-no" id="roundNo">ROUND 01</div><div class="shells" id="shells"></div></div>
          <div class="table">
            <div class="ammo-reveal" id="ammoReveal" role="status" aria-live="polite"><div class="ammo-box"><small>ROUND START</small><div class="ammo-title">今回の装弾</div><div class="ammo-counts"><div class="ammo-count live">実弾<b id="turnLiveCount">0</b></div><div class="ammo-count blank">空包<b id="turnBlankCount">0</b></div></div><div class="ammo-hint">この情報はラウンド開始時だけ表示されます</div></div></div>

        </section>
      </div>
    </section>
  </main>
  <div class="overlay" id="overlay"><div class="result"><div class="eyebrow">GAME OVER</div><h2 id="winner"></h2><p id="resultText"></p><button class="main-btn" id="againBtn">もう一度遊ぶ</button></div></div>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
  (()=>{
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

    let playerCount=2,state=null,busy=false,mode='solo',peer=null,hostConn=null,connections=[],lobby=[],myIndex=0,lastTurnReveal='',turnRevealTimer=null,cpuTimer=null,lastShotShown=0,shotResultTimer=null;
    function renderFields(){const box=$('#nameFields');box.innerHTML='<div class="field"><label>PLAYER 01 // YOU</label><input maxlength="12" value="プレイヤー" aria-label="あなたの名前"></div>';for(let i=1;i<playerCount;i++){box.insertAdjacentHTML('beforeend',`<div class="field"><label>CPU ${String(i).padStart(2,'0')}</label><input value="CPU ${i}" aria-label="CPU ${i}" disabled></div>`)}}
    $$('#countButtons button').forEach(b=>b.onclick=()=>{$$('#countButtons button').forEach(x=>x.classList.remove('on'));b.classList.add('on');playerCount=+b.dataset.count;renderFields()});renderFields();
    function rand(a){return a[Math.floor(Math.random()*a.length)]} function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function audio(type){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);if(type==='live'){o.type='sawtooth';o.frequency.setValueAtTime(90,c.currentTime);g.gain.setValueAtTime(.6,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35)}else{o.type='square';o.frequency.setValueAtTime(180,c.currentTime);g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08)}o.start();o.stop(c.currentTime+(type==='live'?.36:.09))}catch(e){}}
    function addLog(html){state.log.unshift(html);state.log=state.log.slice(0,30)}
    function showTurnAmmo(){if(!state)return;clearTimeout(turnRevealTimer);busy=true;syncRender();const live=state.chamber.filter(Boolean).length;$('#turnLiveCount').textContent=live;$('#turnBlankCount').textContent=state.chamber.length-live;$('#ammoReveal').classList.add('show');turnRevealTimer=setTimeout(()=>{busy=false;syncRender();$('#ammoReveal').classList.remove('show')},1800)}
    function showShotResult(){if(!state?.lastShot)return;const result=state.lastShot,viewer=mode==='solo'?0:myIndex,isSelf=result.target===viewer,target=isSelf?'自分':state.players[result.target].name,box=$('#shotResult'),seat=document.querySelector(`.seat[data-player="${result.target}"]`),frame=box.offsetParent||$('#arena');$('#shotType').textContent=result.bullet?(isSelf?'YOU HIT':'DIRECT HIT'):'BLANK';$('#shotTarget').textContent=result.bullet?`${target} −1 HP`:`${target} ダメージなし`;$('#shotDamage').textContent=result.bullet?(isSelf?'自分が被弾':'相手が被弾'):'空包';box.className='shot-result';box.classList.toggle('blank-shot',!result.bullet);if(seat&&frame){const s=seat.getBoundingClientRect(),a=frame.getBoundingClientRect();if(seat.classList.contains('right')){box.style.left=`${s.left-a.left-10}px`;box.style.top=`${s.top-a.top+s.height/2}px`;box.classList.add('anchor-right')}else if(seat.classList.contains('top')){box.style.left=`${s.left-a.left+s.width/2}px`;box.style.top=`${s.bottom-a.top+9}px`;box.classList.add('anchor-bottom')}else{box.style.left=`${s.right-a.left+10}px`;box.style.top=`${s.top-a.top+s.height/2}px`}}box.classList.add('show');clearTimeout(shotResultTimer);shotResultTimer=setTimeout(()=>box.classList.remove('show'),1600)}
    function makeState(names){return{players:names.map((name,i)=>({name,hp:4,max:4,items:{glass:0,beer:0,cuffs:0,smoke:0},color:['#d6ff4e','#6de1ee','#ffb339','#e887ff'][i]})),current:0,round:0,turnId:0,shotId:0,lastShot:null,chamber:[],known:null,cuffed:null,log:[],gameOver:false}}
    function enterGame(){ $('#setup').classList.remove('active');$('#game').classList.add('active'); }
    function start(){const names=$$('#nameFields input').map((x,i)=>x.value.trim()||`プレイヤー${i+1}`);state=makeState(names);enterGame();newRound()}
    function isHost(){return mode==='host'} function isOnline(){return mode==='host'||mode==='join'} function canAct(){return mode==='solo'?state.current===0:myIndex===state.current}
    function scheduleCpuTurn(){clearTimeout(cpuTimer);if(mode!=='solo'||!state||state.gameOver||state.current===0||busy)return;cpuTimer=setTimeout(()=>{if(mode!=='solo'||!state||state.gameOver||state.current===0||busy)return;const targets=living(),self=state.current,target=Math.random()<.28?self:rand(targets.filter(i=>i!==self));shoot(target,target===self)},900)}
    function broadcast(){if(!isHost()||!state)return;connections.forEach(x=>{if(x.open)x.send({type:'state',state})})}
    function syncRender(){render();broadcast()}
    function newRound(){state.round++;const total=Math.min(4+state.round,8),live=Math.max(1,Math.min(total-1,Math.ceil(total/2)));state.chamber=shuffle([...Array(live).fill(1),...Array(total-live).fill(0)]);state.known=null;state.players.filter(p=>p.hp>0).forEach(p=>{const held=Object.values(p.items).reduce((a,b)=>a+b,0);if(held<3)p.items[rand(Object.keys(items))]++});addLog(`<strong>ROUND ${String(state.round).padStart(2,'0')}</strong> — 実弾 ${live} / 空包 ${total-live} / カードを1枚配布（最大3枚）`);syncRender()}
    function living(){return state.players.map((p,i)=>p.hp>0?i:-1).filter(i=>i>=0)}
    function nextPlayer(from){let i=from;do{i=(i+1)%state.players.length}while(state.players[i].hp<=0);return i}
    function advance(){if(living().length<=1)return end();if(!state.chamber.length){busy=true;syncRender();return setTimeout(newRound,1000)}if(state.cuffed!==null){const skipped=state.cuffed;state.cuffed=null;addLog(`${state.players[skipped].name} は手錠で手番を失った`);state.current=nextPlayer(skipped)}else state.current=nextPlayer(state.current);state.turnId=(state.turnId||0)+1;state.known=null;syncRender()}
    function requestShoot(target){if(!canAct()||busy)return;if(mode==='join')return hostConn.send({type:'action',action:'shoot',target,actor:myIndex});shoot(target,target===state.current)}
    function shoot(target,self){if(busy||!state.players[target]||state.players[target].hp<=0)return;busy=true;const shooter=state.current,bullet=state.chamber.shift();state.known=null;state.shotId=(state.shotId||0)+1;state.lastShot={id:state.shotId,shooter,target,bullet:!!bullet};$('#weapon').classList.add('kick');audio(bullet?'live':'blank');if(bullet){$('#flash').classList.add('go');$('#arena').classList.add('shake');state.players[target].hp--;addLog(`<strong>${state.players[shooter].name}</strong> → ${state.players[target].name}：<span class="live">実弾</span>`)}else addLog(`<strong>${state.players[shooter].name}</strong> → ${state.players[target].name}：<span class="blank">空包</span>`);syncRender();setTimeout(()=>{$('#weapon').classList.remove('kick');$('#flash').classList.remove('go');$('#arena').classList.remove('shake');if(living().length<=1){busy=false;return end()}if(!state.chamber.length){return setTimeout(newRound,1000)}busy=false;if(!bullet&&self){addLog(`${state.players[shooter].name} は続けて行動`);syncRender()}else advance()},650)}
    function requestItem(key){if(!canAct()||busy)return;if(mode==='join')return hostConn.send({type:'action',action:'item',key,actor:myIndex});useItem(key)}
    function useItem(key){if(busy||!items[key]||state.players[state.current].items[key]<=0)return;const p=state.players[state.current];p.items[key]--;if(key==='glass'){state.known=state.chamber[0];addLog(`<strong>${p.name}</strong> がルーペを使用：次は ${state.known?'実弾':'空包'}`)}if(key==='beer'){const b=state.chamber.shift();state.known=null;addLog(`<strong>${p.name}</strong> がビールを使用：${b?'実弾':'空包'}を排出`);if(!state.chamber.length){busy=true;syncRender();return setTimeout(newRound,1000)}}if(key==='cuffs'){const t=nextPlayer(state.current);state.cuffed=t;addLog(`<strong>${p.name}</strong> が ${state.players[t].name} に手錠を使用`)}if(key==='smoke'){const old=p.hp;p.hp=Math.min(p.max,p.hp+1);addLog(`<strong>${p.name}</strong> が煙草を使用${old===p.hp?'（体力は最大）':'（体力 +1）'}`)}syncRender()}
    function render(){const p=state.players[state.current];$('#roundNo').textContent=`ROUND ${String(state.round).padStart(2,'0')}  //  残弾 ${state.chamber.length}`;$('#turnLabel').textContent=`${p.name} の手番`;$('#prompt').textContent=state.known===null?'誰を撃つ？':`次の弾：${state.known?'実弾':'空包'}`;$('#subprompt').textContent='自分への空包なら、もう一度行動できます';
      const revealKey=String(state.round);if(revealKey!==lastTurnReveal){lastTurnReveal=revealKey;setTimeout(showTurnAmmo,0)}
      if(state.lastShot&&state.lastShot.id!==lastShotShown){lastShotShown=state.lastShot.id;setTimeout(showShotResult,0)}
      const hpBars=x=>`<div class="seat-hearts" aria-label="残りHP ${x.hp}">${[0,1,2,3].map(n=>`<i class="seat-heart ${n>=x.hp?'off':''}"></i>`).join('')}</div>`,viewerIndex=mode==='solo'?0:myIndex,viewer=state.players[viewerIndex],opponents=state.players.map((x,i)=>({x,i})).filter(v=>v.i!==viewerIndex),seatMap=opponents.length===1?['top']:opponents.length===2?['left','right']:['left','top','right'],act=i=>i===state.current?'<span style="color:var(--acid)">▶</span> ':'';$('#tablePlayers').innerHTML=opponents.map((v,n)=>`<div class="seat ${seatMap[n]} ${v.i===state.current?'active':''} ${v.x.hp<=0?'out':''}" data-player="${v.i}"><b>${act(v.i)}${esc(v.x.name)}</b>${hpBars(v.x)}<small>${Object.values(v.x.items).reduce((a,b)=>a+b,0)} CARDS</small></div>`).join('')+`<div class="seat you ${viewerIndex===state.current?'active':''}" data-player="${viewerIndex}"><b>${act(viewerIndex)}${esc(viewer.name)} // YOU</b>${hpBars(viewer)}<small>${Object.values(viewer.items).reduce((a,b)=>a+b,0)} CARDS</small></div>`;
      $('#shells').innerHTML='';
      const locked=!canAct()||busy;$('#subprompt').textContent=locked?(mode==='solo'?'CPUが考えています…':'ほかのプレイヤーの手番です'):'自分への空包なら、もう一度行動できます';
      $('#actions').innerHTML=`<button class="action-btn" data-target="${state.current}" ${locked?'disabled':''}>自分を撃つ</button>`+state.players.map((x,i)=>i!==state.current&&x.hp>0?`<button class="action-btn danger" data-target="${i}" ${locked?'disabled':''}>${esc(x.name)}を撃つ</button>`:'').join('');$$('#actions button').forEach(b=>b.onclick=()=>requestShoot(+b.dataset.target));
      const hand=[];Object.entries(p.items).forEach(([k,qty])=>{for(let i=0;i<qty&&hand.length<3;i++)hand.push(k)});while(hand.length<3)hand.push(null);const isOpponent=viewerIndex!==state.current;$('#itemTray').innerHTML=hand.map(k=>k?(isOpponent?`<span class="item-btn facedown"><span class="card-icon">？</span><strong>SECRET</strong><span class="card-desc">相手のカード</span></span>`:`<button class="item-btn" data-item="${k}" ${locked?'disabled':''} title="${items[k].desc}"><span class="card-icon">${items[k].icon}</span><strong>${items[k].name}</strong><span class="card-desc">${items[k].desc}</span></button>`):`<span class="item-btn empty"><span class="card-icon">＋</span>空き</span>`).join('');$$('#itemTray button').forEach(b=>b.onclick=()=>requestItem(b.dataset.item));scheduleCpuTurn();
    }
    function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function showEnd(){const w=state.players[living()[0]];$('#winner').textContent=w?`${w.name} の勝利`:'引き分け';$('#resultText').textContent=`${state.round}ラウンドを生き残りました。`;$('#overlay').classList.add('show')}
    function end(){state.gameOver=true;showEnd();broadcast()}
    function reset(){if(peer)peer.destroy();peer=null;connections=[];lobby=[];mode='solo';lastTurnReveal='';lastShotShown=0;clearTimeout(turnRevealTimer);clearTimeout(shotResultTimer);clearTimeout(cpuTimer);$('#ammoReveal').classList.remove('show');$('#shotResult').classList.remove('show');$('#overlay').classList.remove('show');$('#game').classList.remove('active');$('#setup').classList.add('active');$$('#modeTabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode==='solo'));$('#localBox').hidden=false;$('#onlineBox').classList.remove('show');document.querySelector('.top-note').textContent='SOLO // PLAYER VS CPU';busy=false}
    function setStatus(text){$('#netStatus').textContent=text}
    function drawLobby(list=lobby){$('#lobbyList').innerHTML=list.map((p,i)=>`<span class="lobby-chip">${i===0?'♛ ':''}${esc(p.name)}</span>`).join('');if(isHost())$('#hostStartBtn').disabled=list.length<2}
    function cleanName(){return $('#onlineName').value.trim().slice(0,12)||'プレイヤー'}
    function roomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
    function selectMode(next){mode=next;const multi=next==='host'||next==='join';$$('#modeTabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===(multi?'multi':'solo')));$$('#multiChoice button').forEach(b=>b.classList.toggle('on',b.dataset.multi===next));$('#localBox').hidden=next!=='solo';$('#onlineBox').classList.toggle('show',multi);$('#joinFields').hidden=next!=='join';$('#createBtn').hidden=next!=='host';$('#hostStartBtn').hidden=true;$('#roomCode').hidden=true;$('#lobbyList').innerHTML='';setStatus(next==='host'?'名前を決めてルームを作ってください':next==='join'?'名前と6文字のコードを入力してください':'');document.querySelector('.top-note').textContent=next==='solo'?'SOLO // PLAYER VS CPU':'ONLINE // 2–4 PLAYERS'}
    function setupHost(){if(typeof Peer==='undefined')return setStatus('接続ライブラリを読み込めませんでした。通信環境を確認してください。');const code=roomCode();setStatus('ルームを準備中…');peer=new Peer('last-round-'+code.toLowerCase());peer.on('open',()=>{lobby=[{name:cleanName(),index:0}];myIndex=0;$('#roomCode').textContent=code;$('#roomCode').hidden=false;$('#createBtn').hidden=true;$('#hostStartBtn').hidden=false;setStatus('コードを仲間に伝えてください');drawLobby();peer.on('connection',acceptGuest)});peer.on('error',e=>setStatus(e.type==='unavailable-id'?'コードが重複しました。もう一度ルームを作ってください':'接続できませんでした。もう一度お試しください。'))}
    function acceptGuest(conn){if(state||lobby.length>=4){conn.on('open',()=>conn.send({type:'reject',message:state?'ゲームは開始済みです':'ルームは満員です'}));return}conn.on('data',msg=>{if(msg.type==='join'&&!conn.playerIndex){conn.playerIndex=lobby.length;lobby.push({name:String(msg.name||'プレイヤー').slice(0,12),index:conn.playerIndex});connections.push(conn);conn.send({type:'joined',index:conn.playerIndex,lobby:lobby.map(x=>({name:x.name,index:x.index}))});connections.forEach(c=>{if(c.open)c.send({type:'lobby',lobby:lobby.map(x=>({name:x.name,index:x.index}))})});drawLobby()}else if(msg.type==='action'&&state&&msg.actor===conn.playerIndex&&state.current===conn.playerIndex&&!busy){if(msg.action==='shoot')shoot(Number(msg.target),Number(msg.target)===state.current);if(msg.action==='item')useItem(msg.key)}});conn.on('close',()=>{if(!state&&conn.playerIndex){lobby=lobby.filter(x=>x.index!==conn.playerIndex);connections=connections.filter(x=>x!==conn);lobby.forEach((x,i)=>x.index=i);connections.forEach((x,i)=>x.playerIndex=i+1);drawLobby();connections.forEach(c=>c.send({type:'lobby',lobby}))}})}
    function joinRoom(){if(typeof Peer==='undefined')return setStatus('接続ライブラリを読み込めませんでした。通信環境を確認してください。');const code=$('#roomInput').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(code))return setStatus('6文字のルームコードを入力してください');setStatus('ルームに接続中…');peer=new Peer();peer.on('open',()=>{hostConn=peer.connect('last-round-'+code.toLowerCase(),{reliable:true});hostConn.on('open',()=>hostConn.send({type:'join',name:cleanName()}));hostConn.on('data',msg=>{if(msg.type==='reject')setStatus(msg.message);if(msg.type==='joined'){myIndex=msg.index;drawLobby(msg.lobby);setStatus('参加しました。ホストの開始を待っています。');$('#connectBtn').disabled=true}if(msg.type==='lobby')drawLobby(msg.lobby);if(msg.type==='state'){state=msg.state;if($('#setup').classList.contains('active'))enterGame();render();if(state.gameOver)showEnd()}});hostConn.on('close',()=>setStatus('ホストとの接続が切れました'))});peer.on('error',()=>setStatus('ルームが見つからないか、接続に失敗しました。'))}
    $$('#modeTabs button').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode==='multi'?'host':'solo'));$$('#multiChoice button').forEach(b=>b.onclick=()=>selectMode(b.dataset.multi));$('#createBtn').onclick=setupHost;$('#connectBtn').onclick=joinRoom;$('#roomInput').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z2-9]/g,'');
    $('#hostStartBtn').onclick=()=>{if(lobby.length<2)return;state=makeState(lobby.map(x=>x.name));enterGame();newRound()};
    $('#startBtn').onclick=start;$('#againBtn').onclick=reset;
    document.addEventListener('keydown',e=>{if(!state||!$('#game').classList.contains('active')||busy||!canAct())return;if(e.key>='1'&&e.key<='4'){const i=+e.key-1;if(state.players[i]&&state.players[i].hp>0)requestShoot(i)}});
    const mc=document.modelContext;
    if(mc?.registerTool){
      const schema={type:'object',properties:{},additionalProperties:false};
      Promise.resolve(mc.registerTool({name:'read_game_state',title:'ゲーム状況を確認',description:'現在のラウンド、手番、プレイヤーの体力、残弾数を確認します。',inputSchema:schema,annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){if(!state)return{status:'setup'};return{status:'playing',round:state.round,currentPlayer:state.players[state.current].name,remainingShells:state.chamber.length,players:state.players.map(p=>({name:p.name,hp:p.hp,alive:p.hp>0}))}}})).catch(()=>{});
      Promise.resolve(mc.registerTool({name:'start_local_game',title:'ゲームを開始',description:'設定画面の名前を使って2〜4人のローカル対戦を開始します。',inputSchema:schema,annotations:{readOnlyHint:false,untrustedContentHint:false},execute(){if(!$('#setup').classList.contains('active'))throw new Error('ゲームはすでに進行中です');start();return{status:'started',players:state.players.map(p=>p.name)}}})).catch(()=>{});
    }
  })();
  </script>
</body>
</html>
